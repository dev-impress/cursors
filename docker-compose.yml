version: "3.9"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  catalog-api:
    build:
      context: .
      dockerfile: services/catalog/Catalog.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      CATALOG_DB: Host=postgres;Port=5432;Database=catalog;Username=postgres;Password=postgres
    depends_on:
      - postgres
    ports:
      - "5101:8080"
  receipts-api:
    build:
      context: .
      dockerfile: services/receipts/Receipts.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      RECEIPTS_DB: Host=postgres;Port=5432;Database=receipts;Username=postgres;Password=postgres
      CATALOG_API: http://catalog-api:8080
    depends_on:
      - postgres
      - catalog-api
    ports:
      - "5102:8080"
volumes:
  pgdata: {}
